<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HeavyCare - Servis Alat Berat</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceae4;--sf:#fbfaf7;--sf2:#f1efe9;--ink:#1b2127;--mut:#68717a;--ln:#d6d2c8;--yl:#f2b705;--ok:#237a4b;--wn:#b36f06;--bd:#c23a2b;--okb:#dcefe2;--wnb:#fbecc9;--bdb:#f7dad5;--side:#1b2127;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#e9e7e1;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:8px;background:var(--yl);color:#1b2127;display:grid;place-items:center;flex:none}
.brand b{font:700 18px/1.1 "Barlow Semi Condensed",sans-serif}.brand small{display:block;opacity:.6;font-size:12px}
aside a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:6px;display:flex;gap:8px;align-items:center;opacity:.8}
aside a:hover{background:rgba(255,255,255,.08);opacity:1}
aside a.on{background:rgba(255,255,255,.12);opacity:1;box-shadow:inset 3px 0 0 var(--yl)}
.bg{background:var(--bd);color:#fff;border-radius:99px;font-size:12px;padding:0 8px;margin-left:auto}
.who{margin-top:auto;font-size:13px;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.15)}
.who b{display:block}.who button{margin-top:8px;width:100%}
main{padding:18px 22px 40px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:28px;font-weight:700;flex:1;min-width:200px;line-height:1.1}
.top small{display:block;font:400 13px Barlow,sans-serif;color:var(--mut);margin-top:3px}
.btn{border:1px solid var(--ln);background:var(--sf);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--yl);border-color:var(--yl);color:#1b2127}
.btn.sm{padding:3px 9px;font-size:13px}.btn.dng{color:var(--bd)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;min-width:0}
.p h2{font-size:19px;margin-bottom:10px}
.k{display:flex;align-items:center;gap:12px}.k .num{font-size:38px;font-weight:700;line-height:1}.k span{color:var(--mut);font-size:13px;display:block}
.k.r{border-left:4px solid var(--bd)}.k.w{border-left:4px solid var(--wn)}.k.r .num{color:var(--bd)}.k.w .num{color:var(--wn)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;margin:8px 0}
.bar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;min-width:60px;margin:6px 0}.bar i{display:block;height:100%;border-radius:4px}
.hb .bar{margin:0}
.f-ok{background:var(--ok)}.f-wn{background:var(--wn)}.f-bd{background:var(--bd)}
.tag{font:600 12px Barlow,sans-serif;padding:2px 9px;border-radius:99px;white-space:nowrap}
.t-bd{background:var(--bdb);color:var(--bd)}.t-wn{background:var(--wnb);color:var(--wn)}.t-ok{background:var(--okb);color:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:last-child td{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:12px}
.uh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.uh h3{font-size:20px;font-weight:700;line-height:1.1}.m,.sub{color:var(--mut);font-size:13px}
.rd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sf2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rd input{width:130px;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
.ir{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(60px,1fr) 92px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}
.ir .nm{font-weight:600;line-height:1.2}.rm{font-size:12.5px;color:var(--mut);display:block;font-weight:400}
.ac{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--ln);border-radius:10px;background:var(--sf)}
.tl{font-size:13px;padding:5px 0;border-top:1px solid var(--ln)}.tl b{color:var(--mut);font-weight:600}
.sec{font-size:20px;margin:18px 0 8px}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:20}
.md{background:var(--sf);border-radius:10px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.md h2{font-size:22px;margin-bottom:8px}.md label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
.md input,.md select,.lgn input{width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
.md .ac{justify-content:flex-end;margin-top:16px}
.lgn{max-width:380px;margin:8vh auto;padding:0 16px}.lgn .p{padding:22px}
.lgn label{display:block;font-weight:600;font-size:13px;margin:12px 0 3px}.lgn .btn{width:100%;margin-top:16px}
.err{color:var(--bd);font-size:13px;min-height:18px;margin-top:8px}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:30;max-width:90vw}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px}.brand{margin:0 auto 0 0}.who{margin:0;border:0;padding:0;display:flex;gap:8px;align-items:center}.who button{margin:0;width:auto}main{padding:14px}}
@media(max-width:560px){.ir{grid-template-columns:1fr 1fr}.ir .bar{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div id="root"></div><div id="modal"></div>
<script>
var KEY='servis_alat_berat_v2',SES='sab_user';
var TPL={HM:[['Oli mesin',250],['Filter oli mesin',250],['Filter solar',250],['Filter udara',500],['Oli hidrolik',2000],['Filter hidrolik',1000],['Oli transmisi',1000],['Oli final drive',1000],['Pelumasan (grease)',50],['Cek undercarriage',500]],
KM:[['Oli mesin',5000],['Filter oli mesin',5000],['Filter solar',10000],['Filter udara',15000],['Oli transmisi',40000],['Oli gardan',40000],['Minyak rem',40000],['Kampas rem',30000],['Ban',50000],['V-belt',40000]]};
var PG={admin:[['ringkasan','Ringkasan'],['prioritas','Prioritas servis'],['armada','Armada'],['perbaikan','Perbaikan'],['pengguna','Pengguna'],['log','Log aktivitas']],operator:[['unit','Unit saya'],['laporan','Laporan saya']],mekanik:[['perbaikan','Perbaikan'],['berkala','Servis berkala']]};
var RN={admin:'Admin',operator:'Operator',mekanik:'Mekanik'};
var RT={'Dilaporkan':'t-wn','Dikerjakan':'t-wn','Menunggu sparepart':'t-bd','Selesai':'t-ok'};
var ACL={addunit:['admin'],editu:['admin'],delu:['admin'],addi:['admin'],edit:['admin'],deli:['admin'],svc:['mekanik'],read:['operator'],lapor:['operator'],newrep:['admin','mekanik'],upd:['mekanik'],delrep:['admin'],adduser:['admin'],deluser:['admin'],edituser:['admin'],notif:['admin']};
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return new Date(Date.now()+d*864e5).toISOString()}
function mk(name,code,unit,reading,off,daily){return{id:uid(),name:name,code:code,unit:unit,reading:reading,daily:daily,items:TPL[unit].map(function(t,i){return{id:uid(),name:t[0],interval:t[1],last:Math.max(0,reading-off[i%off.length])}})}}
function seed(){var u=[mk('Excavator PC200-8','EX-01','HM',3480,[240,120,260,300,900,400,200,100,30,150],9),mk('Wheel Loader WA320','WL-03','HM',5210,[60,50,80,200,1500,300,950,500,20,100],7),mk('Dump Truck Hino 500','DT-07','KM',128400,[4800,2000,9500,6000,12000,38000,20000,10000,45000,5000],220),mk('Bulldozer D6R','BD-02','HM',8120,[100,100,90,200,600,200,300,200,10,520],8)];
 return{units:u,log:[],users:[{id:'u1',name:'Administrator',user:'admin',pass:'admin123',role:'admin',email:'admin@contoh.com',units:[]},{id:'u2',name:'Budi Santoso',user:'operator',pass:'operator123',role:'operator',email:'operator@contoh.com',units:['EX-01','DT-07']},{id:'u3',name:'Rudi Hartono',user:'mekanik',pass:'mekanik123',role:'mekanik',email:'mekanik@contoh.com',units:[]}],
 repairs:[{id:uid(),u:u[0].id,title:'Kebocoran oli hidrolik di silinder boom',by:'u2',mech:'Rudi Hartono',status:'Menunggu sparepart',pct:45,t:iso(-2),eta:iso(1).slice(0,10),updates:[{t:iso(-2),by:'Rudi Hartono',status:'Dikerjakan',pct:20,note:'Selang dan silinder dibongkar, seal rusak.'},{t:iso(-1),by:'Rudi Hartono',status:'Menunggu sparepart',pct:45,note:'Seal kit sudah dipesan, menunggu pengiriman.'}]}]}}
function load(){var d,o;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d||!d.users){d=seed();try{o=JSON.parse(localStorage.getItem('servis_alat_berat_v1'));if(o&&o.units&&o.units.length){d.units=o.units;d.repairs=[]}}catch(e){}}return d}
var S=load(),me=null,cur='';
try{var sid=localStorage.getItem(SES);me=S.users.filter(function(x){return x.id==sid})[0]||null}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number(n).toLocaleString('id-ID')}
function dt(i){return new Date(i).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function fd(s){return new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function lg(a,k){S.log.push({t:new Date().toISOString(),u:me.name,id:me.id,a:a,k:k||''});if(S.log.length>300)S.log.shift()}
function find(id){return S.units.filter(function(u){return u.id==id})[0]}
function toast(m){var d=document.createElement('div');d.className='ts';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
function st(u,it){var rem=it.last+it.interval-u.reading,pct=Math.max(0,Math.min(100,rem/it.interval*100)),k=rem<=0?'bd':(rem<=it.interval*.1?'wn':'ok');return{rem:rem,pct:pct,k:k,label:k=='bd'?'Terlambat':k=='wn'?'Segera':'Aman'}}
function eta(u,s){if(s.rem<=0)return 'Sekarang';return fd(Date.now()+Math.ceil(s.rem/(u.daily||(u.unit=='HM'?8:150)))*864e5)}
function uinfo(u){var c={bd:0,wn:0,ok:0},t=0;u.items.forEach(function(it){var s=st(u,it);c[s.k]++;t+=s.pct});return{c:c,h:u.items.length?Math.round(t/u.items.length):100,k:c.bd?'bd':c.wn?'wn':'ok'}}
function ring(p,k,z){var C=251.33;return'<svg width="'+z+'" height="'+z+'" viewBox="0 0 100 100" role="img" aria-label="'+p+' persen"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--sf2)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--'+k+')" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+p/100*C+' '+C+'" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor" font-family="Barlow Semi Condensed,sans-serif">'+p+'%</text></svg>'}
function alerts(list){var al=[];(list||S.units).forEach(function(u){u.items.forEach(function(it){var s=st(u,it);if(s.k!='ok')al.push({u:u,it:it,s:s})})});return al.sort(function(a,b){return a.s.rem/a.it.interval-b.s.rem/b.it.interval})}
function active(){return S.repairs.filter(function(r){return r.status!='Selesai'})}
function inRep(u){return S.repairs.some(function(r){return r.u==u.id&&r.status!='Selesai'})}
function mine(){return S.units.filter(function(u){return me.units.map(function(c){return c.toUpperCase()}).indexOf((u.code||'').toUpperCase())>-1})}
/* ---------- halaman ---------- */
var V={};
V.ringkasan=function(){var c={bd:0,wn:0,ok:0},tp=0,n=0;S.units.forEach(function(u){u.items.forEach(function(it){var s=st(u,it);c[s.k]++;tp+=s.pct;n++})});var fh=n?Math.round(tp/n):100;
 return'<div class="kpi"><div class="p k">'+ring(fh,c.bd?'bd':c.wn?'wn':'ok',76)+'<div><b>Kesehatan armada</b><span>Rata-rata sisa umur komponen</span></div></div><div class="p k"><div class="num">'+S.units.length+'</div><div><b>Unit aktif</b><span>'+n+' item dipantau</span></div></div><div class="p k r"><div class="num">'+c.bd+'</div><div><b>Terlambat</b><span>Perlu diganti sekarang</span></div></div><div class="p k w"><div class="num">'+c.wn+'</div><div><b>Segera</b><span>Sisa interval 10% atau kurang</span></div></div><div class="p k"><div class="num">'+active().length+'</div><div><b>Dalam perbaikan</b><span>Pekerjaan mekanik berjalan</span></div></div></div><div class="p"><h2>Sisa umur komponen per unit</h2>'+(S.units.map(function(u){var i=uinfo(u);return'<div class="hb"><span>'+esc(u.code||u.name)+(inRep(u)?' <span class="tag t-bd">Perbaikan</span>':'')+'</span><div class="bar"><i class="f-'+i.k+'" style="width:'+i.h+'%"></i></div><b>'+i.h+'%</b></div>'}).join('')||'<div class="empty">Belum ada unit.</div>')+'</div>'}
function prio(act){var al=alerts();return'<div class="p"><div class="tw">'+(al.length?'<table><thead><tr><th>Unit</th><th>Item</th><th>Status</th><th>Sisa</th><th>Jatuh tempo</th><th>Estimasi tanggal</th>'+(act?'<th></th>':'')+'</tr></thead><tbody>'+al.map(function(x){return'<tr><td><b>'+esc(x.u.code||x.u.name)+'</b></td><td>'+esc(x.it.name)+'</td><td><span class="tag t-'+x.s.k+'">'+x.s.label+'</span></td><td>'+(x.s.rem>0?fmt(x.s.rem):'-'+fmt(-x.s.rem))+' '+x.u.unit+'</td><td>'+fmt(x.it.last+x.it.interval)+' '+x.u.unit+'</td><td>'+eta(x.u,x.s)+'</td>'+(act?'<td><button class="btn sm pri" data-a="svc" data-u="'+x.u.id+'" data-i="'+x.it.id+'">Sudah diganti</button></td>':'')+'</tr>'}).join('')+'</tbody></table>':'<div class="empty">Semua komponen aman. Tidak ada servis yang mendesak.</div>')+'</div></div>'}
V.prioritas=function(){return prio(false)};V.berkala=function(){return prio(true)};
function head(u,i,extra){return'<div class="uh">'+ring(i.h,i.k,58)+'<div style="flex:1;min-width:150px"><h3>'+esc(u.name)+'</h3><div class="m">Kode '+esc(u.code||'-')+' · rata-rata '+fmt(u.daily||1)+' '+u.unit+' per hari '+(inRep(u)?'<span class="tag t-bd">Dalam perbaikan</span>':'')+'</div></div>'+extra+'</div>'}
function ucardA(u){var i=uinfo(u);return'<section class="p">'+head(u,i,'<button class="btn sm" data-a="editu" data-u="'+u.id+'">Atur</button><button class="btn sm dng" data-a="delu" data-u="'+u.id+'">Hapus</button>')+'<div class="m" style="margin-bottom:6px">Pembacaan terakhir: <b>'+fmt(u.reading)+' '+u.unit+'</b></div>'+u.items.map(function(it){var s=st(u,it);return'<div class="ir"><div class="nm">'+esc(it.name)+'<span class="rm">tiap '+fmt(it.interval)+' '+u.unit+' · terakhir '+fmt(it.last)+'</span></div><div class="bar"><i class="f-'+s.k+'" style="width:'+s.pct+'%"></i></div><div><span class="tag t-'+s.k+'">'+s.label+'</span><span class="rm">'+(s.rem>0?'sisa '+fmt(s.rem):'lewat '+fmt(-s.rem))+' '+u.unit+'</span></div><div class="ac"><button class="btn sm" data-a="edit" data-u="'+u.id+'" data-i="'+it.id+'">Ubah</button><button class="btn sm dng" data-a="deli" data-u="'+u.id+'" data-i="'+it.id+'">Hapus</button></div></div>'}).join('')+'<div style="margin-top:8px"><button class="btn sm" data-a="addi" data-u="'+u.id+'">Tambah item servis</button></div></section>'}
V.armada=function(){return'<div style="margin-bottom:12px"><button class="btn pri" data-a="addunit">Tambah unit</button></div><div class="grid">'+(S.units.map(ucardA).join('')||'<div class="empty">Belum ada unit.</div>')+'</div>'}
V.unit=function(){var L=mine();return L.length?'<div class="grid">'+L.map(function(u){var i=uinfo(u),al=alerts([u]);
 return'<section class="p">'+head(u,i,'<button class="btn sm dng" data-a="lapor" data-u="'+u.id+'">Lapor kerusakan</button>')+'<div class="rd"><label for="r'+u.id+'"><b>Input '+u.unit+' hari ini</b></label><input id="r'+u.id+'" type="number" min="0" value="'+u.reading+'"><button class="btn sm pri" data-a="read" data-u="'+u.id+'">Simpan</button></div><div class="m" style="margin:8px 0 4px">Peringatan maintenance</div>'+(al.length?al.map(function(x){return'<div class="ir" style="grid-template-columns:1fr auto"><div class="nm">'+esc(x.it.name)+'<span class="rm">jatuh tempo di '+fmt(x.it.last+x.it.interval)+' '+u.unit+' · '+(x.s.rem>0?'sisa '+fmt(x.s.rem):'lewat '+fmt(-x.s.rem))+' '+u.unit+'</span></div><span class="tag t-'+x.s.k+'">'+x.s.label+'</span></div>'}).join(''):'<div class="empty" style="padding:14px">Semua komponen aman.</div>')+'</section>'}).join('')+'</div>':'<div class="empty">Belum ada unit yang ditugaskan kepada Anda. Hubungi admin.</div>'}
function rcard(r,mode){var u=find(r.u)||{name:'(unit dihapus)',code:''},end=r.done?new Date(r.done):new Date(),days=Math.floor((end-new Date(r.t))/864e5)+1,k=r.status=='Selesai'?'ok':r.status=='Menunggu sparepart'?'bd':'wn';
 return'<section class="p"><div class="uh"><div style="flex:1;min-width:160px"><h3>'+esc(u.name)+'</h3><div class="m">'+esc(r.title)+'</div></div><span class="tag '+RT[r.status]+'">'+r.status+'</span></div><div class="bar"><i class="f-'+k+'" style="width:'+r.pct+'%"></i></div><div class="sub">'+r.pct+'% · mulai '+dt(r.t)+' · hari ke-'+days+(r.eta&&!r.done?' · estimasi selesai '+fd(r.eta):'')+(r.mech?' · mekanik '+esc(r.mech):'')+'</div><div style="margin-top:8px">'+r.updates.slice().reverse().slice(0,4).map(function(x){return'<div class="tl"><b>'+dt(x.t)+'</b> · '+x.status+' '+x.pct+'% · '+esc(x.note||'-')+' <span class="m">('+esc(x.by)+')</span></div>'}).join('')+'</div>'+
 (mode=='mek'&&!r.done?'<div class="ac" style="margin-top:8px"><button class="btn sm pri" data-a="upd" data-r="'+r.id+'">Update progress</button></div>':'')+(mode=='adm'?'<div class="ac" style="margin-top:8px"><button class="btn sm dng" data-a="delrep" data-r="'+r.id+'">Hapus</button></div>':'')+'</section>'}
V.perbaikan=function(){var m=me.role=='mekanik'?'mek':'adm',a=active(),d=S.repairs.filter(function(r){return r.status=='Selesai'}).slice(-5).reverse();
