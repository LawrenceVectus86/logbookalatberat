<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Servis Alat Berat</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceae4;--sf:#fbfaf7;--sf2:#f1efe9;--ink:#1b2127;--mut:#68717a;--ln:#d6d2c8;--yl:#f2b705;--on:#1b2127;--ok:#237a4b;--wn:#b36f06;--bd:#c23a2b;--okb:#dcefe2;--wnb:#fbecc9;--bdb:#f7dad5;--side:#1b2127;--sideink:#e9e7e1;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:8px;background:var(--yl);color:#1b2127;display:grid;place-items:center;flex:none}
.brand b{font:700 18px/1.1 "Barlow Semi Condensed",sans-serif}.brand small{display:block;opacity:.6;font-size:12px}
aside a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:6px;display:flex;gap:10px;align-items:center;opacity:.8}
aside a:hover{background:rgba(255,255,255,.08);opacity:1}
aside .ft{margin-top:auto;font-size:12px;opacity:.55;padding:0 6px}
main{padding:18px 22px 40px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:28px;font-weight:700;flex:1;min-width:220px;line-height:1.1}
.top h1 small{display:block;font:400 13px Barlow,sans-serif;color:var(--mut);margin-top:3px}
.btn{border:1px solid var(--ln);background:var(--sf);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--yl);border-color:var(--yl);color:#1b2127}
.btn.sm{padding:3px 9px;font-size:13px}.btn.dng{color:var(--bd)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;min-width:0}
.p h2{font-size:19px;margin-bottom:10px}
.k{display:flex;align-items:center;gap:12px}
.k .num{font-size:38px;font-weight:700;line-height:1}.k span{color:var(--mut);font-size:13px;display:block}
.k.r{border-left:4px solid var(--bd)}.k.w{border-left:4px solid var(--wn)}.k.g{border-left:4px solid var(--ok)}
.k.r .num{color:var(--bd)}.k.w .num{color:var(--wn)}
.row2{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-bottom:12px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lg div{display:flex;gap:8px;align-items:center;margin:4px 0}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.hb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:4px}
.f-ok{background:var(--ok)}.f-wn{background:var(--wn)}.f-bd{background:var(--bd)}
.tag{font:600 12px Barlow,sans-serif;padding:2px 9px;border-radius:99px;white-space:nowrap}
.t-bd{background:var(--bdb);color:var(--bd)}.t-wn{background:var(--wnb);color:var(--wn)}.t-ok{background:var(--okb);color:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:last-child td{border-bottom:0}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.fl input{padding:7px 11px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);min-width:200px;flex:1;max-width:320px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 13px;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
.uh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.uh h3{font-size:20px;font-weight:700;line-height:1.1}.uh .m{color:var(--mut);font-size:13px}
.rd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sf2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rd input{width:120px;padding:5px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
.ir{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(60px,1fr) 92px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}
.ir .nm{font-weight:600;line-height:1.2}.ir .rm{font-size:12.5px;color:var(--mut);display:block;font-weight:400}
.ir .ac{display:flex;gap:4px}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--ln);border-radius:10px}
.lg2{font-size:13.5px}.lg2 div{padding:7px 0;border-top:1px solid var(--ln);display:flex;gap:10px;flex-wrap:wrap}.lg2 div:first-child{border-top:0}.lg2 time{color:var(--mut);min-width:84px}
.pg{display:none}.pg.on{display:block}
aside a.on{background:rgba(255,255,255,.12);opacity:1;box-shadow:inset 3px 0 0 var(--yl)}
.bg{background:var(--bd);color:#fff;border-radius:99px;font-size:12px;padding:0 8px;margin-left:auto}.bg:empty{display:none}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.md{background:var(--sf);border-radius:10px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.md h2{font-size:22px;margin-bottom:8px}.md label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
.md input,.md select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
.md .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px}.brand{margin:0 auto 0 0}aside a{padding:6px 9px}aside .ft{display:none}.kpi{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}main{padding:14px}}
@media(max-width:560px){.ir{grid-template-columns:1fr 1fr}.ir .bar{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand"><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h12M5 18v-4h7l2-5h3l3 5v4M9 9V5h4"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></div><div><b>HeavyCare</b><small>Servis alat berat</small></div></div>
<a href="#ringkasan" data-p="ringkasan">Ringkasan</a><a href="#prioritas" data-p="prioritas">Prioritas servis<span class="bg" id="bg"></span></a><a href="#armada" data-p="armada">Armada</a><a href="#riwayat" data-p="riwayat">Riwayat</a>
<div class="ft">Data tersimpan di browser ini.</div>
</aside>
<main>
<div class="top"><h1><span id="ttl">Ringkasan armada</span><small id="now"></small></h1><button class="btn pri" data-a="addunit">Tambah unit</button></div>
<section class="pg" id="pg-ringkasan">
<div class="kpi" id="kpi"></div>
<div class="row2"><div class="p"><h2>Sebaran status item</h2><div class="dn" id="dn"></div></div><div class="p"><h2>Sisa umur komponen per unit</h2><div id="hb"></div></div></div>
</section>
<section class="pg" id="pg-prioritas"><div class="p"><h2>Item yang perlu diganti</h2><div class="tw" id="pr"></div></div></section>
<section class="pg" id="pg-armada"><div class="fl" id="fl"></div><div class="grid" id="units"></div></section>
<section class="pg" id="pg-riwayat"><div class="p lg2" id="hist"></div></section>
</main>
</div>
<div id="modal"></div>
<script>
var KEY='servis_alat_berat_v1',TKEY='servis_tema';
var TPL={HM:[['Oli mesin',250],['Filter oli mesin',250],['Filter solar',250],['Filter udara',500],['Oli hidrolik',2000],['Filter hidrolik',1000],['Oli transmisi',1000],['Oli final drive',1000],['Pelumasan (grease)',50],['Cek undercarriage',500]],
KM:[['Oli mesin',5000],['Filter oli mesin',5000],['Filter solar',10000],['Filter udara',15000],['Oli transmisi',40000],['Oli gardan',40000],['Minyak rem',40000],['Kampas rem',30000],['Ban',50000],['V-belt',40000]]};
var filt='all',q='';
function uid(){return Math.random().toString(36).slice(2,9)}
function mk(name,code,unit,reading,off,daily){
  return{id:uid(),name:name,code:code,unit:unit,reading:reading,daily:daily||(unit=='HM'?8:150),log:[],items:TPL[unit].map(function(t,i){return{id:uid(),name:t[0],interval:t[1],last:Math.max(0,reading-(off?off[i%off.length]:0))}})};
}
function seed(){return{units:[
 mk('Excavator PC200-8','EX-01','HM',3480,[240,120,260,300,900,400,200,100,30,150],9),
 mk('Wheel Loader WA320','WL-03','HM',5210,[60,50,80,200,1500,300,950,500,20,100],7),
 mk('Dump Truck Hino 500','DT-07','KM',128400,[4800,2000,9500,6000,12000,38000,20000,10000,45000,5000],220),
 mk('Bulldozer D6R','BD-02','HM',8120,[100,100,90,200,600,200,300,200,10,520],8)]}}
var S;try{S=JSON.parse(localStorage.getItem(KEY));if(!S||!S.units)S=seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number(n).toLocaleString('id-ID')}
function st(u,it){var rem=it.last+it.interval-u.reading,pct=Math.max(0,Math.min(100,rem/it.interval*100)),k=rem<=0?'bd':(rem<=it.interval*.1?'wn':'ok');
 return{rem:rem,pct:pct,k:k,label:k=='bd'?'Terlambat':k=='wn'?'Segera':'Aman'}}
function eta(u,s){if(s.rem<=0)return 'Sekarang';var d=u.daily||(u.unit=='HM'?8:150);return new Date(Date.now()+Math.ceil(s.rem/d)*864e5).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function uinfo(u){var c={bd:0,wn:0,ok:0},t=0;u.items.forEach(function(it){var s=st(u,it);c[s.k]++;t+=s.pct});
 return{c:c,h:u.items.length?Math.round(t/u.items.length):100,k:c.bd?'bd':c.wn?'wn':'ok'}}
function ring(p,k,size){var C=251.33,d=p/100*C;return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" role="img" aria-label="'+p+' persen"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--sf2)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--'+k+')" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+d+' '+C+'" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor" font-family="Barlow Semi Condensed,sans-serif">'+p+'%</text></svg>'}
function render(){
 document.getElementById('now').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 var c={bd:0,wn:0,ok:0},al=[],tp=0,n=0;
 S.units.forEach(function(u){u.items.forEach(function(it){var s=st(u,it);c[s.k]++;tp+=s.pct;n++;if(s.k!='ok')al.push({u:u,it:it,s:s})})});
 document.getElementById('bg').textContent=al.length||'';var fh=n?Math.round(tp/n):100,fk=c.bd?'bd':c.wn?'wn':'ok';
 document.getElementById('kpi').innerHTML='<div class="p k">'+ring(fh,fk,76)+'<div><b>Kesehatan armada</b><span>Rata-rata sisa umur komponen</span></div></div><div class="p k"><div class="num">'+S.units.length+'</div><div><b>Unit aktif</b><span>'+n+' item dipantau</span></div></div><div class="p k r"><div class="num">'+c.bd+'</div><div><b>Terlambat</b><span>Perlu diganti sekarang</span></div></div><div class="p k w"><div class="num">'+c.wn+'</div><div><b>Segera</b><span>Sisa interval 10% atau kurang</span></div></div>';
 var C=251.33,cum=0,segs=[['bd',c.bd,'Terlambat'],['wn',c.wn,'Segera'],['ok',c.ok,'Aman']],tot=n||1;
 document.getElementById('dn').innerHTML='<svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Sebaran status"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--sf2)" stroke-width="14"/>'+segs.map(function(x){var l=x[1]/tot*C,o=cum;cum+=l;return l?'<circle cx="50" cy="50" r="40" fill="none" stroke="var(--'+x[0]+')" stroke-width="14" stroke-dasharray="'+l+' '+C+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 50 50)"/>':''}).join('')+'<text x="50" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor" font-family="Barlow Semi Condensed,sans-serif">'+n+'</text></svg><div class="lg">'+segs.map(function(x){return'<div><i class="f-'+x[0]+'"></i>'+x[2]+': <b>'+x[1]+'</b></div>'}).join('')+'</div>';
 document.getElementById('hb').innerHTML=S.units.length?S.units.map(function(u){var i=uinfo(u);return'<div class="hb"><span title="'+esc(u.name)+'">'+esc(u.code||u.name)+'</span><div class="bar"><i class="f-'+i.k+'" style="width:'+i.h+'%"></i></div><b>'+i.h+'%</b></div>'}).join(''):'<div class="empty">Belum ada unit.</div>';
 al.sort(function(a,b){return a.s.rem/a.it.interval-b.s.rem/b.it.interval});
 document.getElementById('pr').innerHTML=al.length?'<table><thead><tr><th>Unit</th><th>Item</th><th>Status</th><th>Sisa</th><th>Jatuh tempo</th><th>Estimasi tanggal</th><th></th></tr></thead><tbody>'+al.slice(0,10).map(function(x){return'<tr><td><b>'+esc(x.u.code||x.u.name)+'</b></td><td>'+esc(x.it.name)+'</td><td><span class="tag t-'+x.s.k+'">'+x.s.label+'</span></td><td>'+(x.s.rem>0?fmt(x.s.rem):'-'+fmt(-x.s.rem))+' '+x.u.unit+'</td><td>'+fmt(x.it.last+x.it.interval)+' '+x.u.unit+'</td><td>'+eta(x.u,x.s)+'</td><td><button class="btn sm pri" data-a="svc" data-u="'+x.u.id+'" data-i="'+x.it.id+'">Sudah diganti</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">Semua komponen aman. Tidak ada servis yang mendesak.</div>';
 var h=[];S.units.forEach(function(u){u.log.forEach(function(l){h.push({u:u,l:l})})});
 document.getElementById('hist').innerHTML=h.length?h.slice(-10).reverse().map(function(x){return'<div><time>'+esc(x.l.d)+'</time><b>'+esc(x.u.name)+'</b><span>'+esc(x.l.n)+' diganti di '+fmt(x.l.r)+' '+x.u.unit+'</span></div>'}).join(''):'<div class="empty">Belum ada penggantian tercatat. Tekan Sudah diganti setelah servis selesai.</div>';
 fleet();
}
function fleet(){
 var f=[['all','Semua'],['bd','Terlambat'],['wn','Segera'],['ok','Aman']];
 var fl=document.getElementById('fl');
 if(!document.getElementById('sq')){fl.innerHTML='<input id="sq" type="search" placeholder="Cari nama atau kode unit" aria-label="Cari unit"><span id="chips"></span>';document.getElementById('sq').oninput=function(e){q=e.target.value.toLowerCase();fleet()}}
 document.getElementById('chips').innerHTML=f.map(function(x){return'<button class="chip'+(filt==x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'</button> '}).join('');
 var L=S.units.filter(function(u){return(filt=='all'||uinfo(u).k==filt)&&(u.name+' '+(u.code||'')).toLowerCase().indexOf(q)>-1});
 document.getElementById('units').innerHTML=L.length?L.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Tidak ada unit yang cocok dengan filter ini.</div>';
}
function card(u){var i=uinfo(u);
 var rows=u.items.map(function(it){var s=st(u,it);return'<div class="ir"><div class="nm">'+esc(it.name)+'<span class="rm">tiap '+fmt(it.interval)+' '+u.unit+' · terakhir '+fmt(it.last)+'</span></div><div class="bar"><i class="f-'+s.k+'" style="width:'+s.pct+'%"></i></div><div><span class="tag t-'+s.k+'">'+s.label+'</span><span class="rm">'+(s.rem>0?'sisa '+fmt(s.rem):'lewat '+fmt(-s.rem))+' '+u.unit+'</span></div><div class="ac"><button class="btn sm pri" data-a="svc" data-u="'+u.id+'" data-i="'+it.id+'">Ganti</button><button class="btn sm" data-a="edit" data-u="'+u.id+'" data-i="'+it.id+'" aria-label="Ubah interval">Ubah</button><button class="btn sm dng" data-a="deli" data-u="'+u.id+'" data-i="'+it.id+'" aria-label="Hapus item">Hapus</button></div></div>'}).join('');
 return'<section class="p"><div class="uh">'+ring(i.h,i.k,58)+'<div style="flex:1;min-width:150px"><h3>'+esc(u.name)+'</h3><div class="m">Kode '+esc(u.code||'-')+' · rata-rata '+fmt(u.daily||1)+' '+u.unit+' per hari</div></div><button class="btn sm" data-a="editu" data-u="'+u.id+'">Atur</button><button class="btn sm dng" data-a="delu" data-u="'+u.id+'">Hapus</button></div><div class="rd"><label for="r'+u.id+'"><b>Pembacaan saat ini ('+u.unit+')</b></label><input id="r'+u.id+'" type="number" min="0" value="'+u.reading+'"><button class="btn sm pri" data-a="read" data-u="'+u.id+'">Perbarui</button></div>'+rows+'<div style="margin-top:8px"><button class="btn sm" data-a="addi" data-u="'+u.id+'">Tambah item servis</button></div></section>'}
function find(id){return S.units.filter(function(u){return u.id==id})[0]}
function modal(title,fields,ok){var m=document.getElementById('modal');
 m.innerHTML='<div class="mk"><div class="md" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2>'+fields.map(function(f,i){return'<label for="f'+i+'">'+esc(f.l)+'</label>'+(f.o?'<select id="f'+i+'">'+f.o.map(function(o){return'<option value="'+o[0]+'"'+(o[0]==f.v?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>':'<input id="f'+i+'" type="'+(f.t||'text')+'" value="'+esc(f.v==null?'':f.v)+'">')}).join('')+'<div class="ac"><button class="btn" id="mx">Batal</button><button class="btn pri" id="mo">Simpan</button></div></div></div>';
 var close=function(){m.innerHTML=''};document.getElementById('mx').onclick=close;
 document.getElementById('mo').onclick=function(){var v=fields.map(function(f,i){return document.getElementById('f'+i).value});if(ok(v)!==false)close()};document.getElementById('f0').focus()}
document.addEventListener('keydown',function(e){if(e.key=='Escape'){var x=document.getElementById('mx');if(x)x.click()}});
document.addEventListener('click',function(e){
 var c=e.target.closest('[data-f]');if(c){filt=c.dataset.f;fleet();return}
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 var u=find(b.dataset.u),it=u&&u.items.filter(function(x){return x.id==b.dataset.i})[0];
 if(a=='addunit')modal('Tambah unit',[{l:'Nama alat',v:''},{l:'Kode / nopol',v:''},{l:'Satuan pemantauan',o:[['HM','Jam kerja (HM)'],['KM','Kilometer (KM)']],v:'HM'},{l:'Pembacaan saat ini',t:'number',v:0},{l:'Rata-rata pemakaian per hari',t:'number',v:''}],function(v){
  if(!v[0].trim())return false;S.units.push(mk(v[0].trim(),v[1].trim(),v[2],Math.max(0,+v[3]||0),null,+v[4]||0));save();render()});
 if(a=='editu')modal('Atur unit',[{l:'Nama alat',v:u.name},{l:'Kode / nopol',v:u.code},{l:'Rata-rata pemakaian per hari ('+u.unit+')',t:'number',v:u.daily}],function(v){if(!v[0].trim())return false;u.name=v[0].trim();u.code=v[1].trim();u.daily=+v[2]>0?+v[2]:u.daily;save();render()});
 if(a=='read'){var n=+document.getElementById('r'+u.id).value;if(isNaN(n)||n<0)return;u.reading=n;save();render()}

var PG={ringkasan:'Ringkasan armada',prioritas:'Prioritas servis',armada:'Armada',riwayat:'Riwayat penggantian'};
function route(){var h=(location.hash||'#ringkasan').slice(1);if(!PG[h])h='ringkasan';
 Object.keys(PG).forEach(function(n){document.getElementById('pg-'+n).classList.toggle('on',n==h)});
 document.querySelectorAll('aside a[data-p]').forEach(function(a){a.classList.toggle('on',a.dataset.p==h)});
 document.getElementById('ttl').textContent=PG[h];window.scrollTo(0,0)}
addEventListener('hashchange',route);
render();route();
